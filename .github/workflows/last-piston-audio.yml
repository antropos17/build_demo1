name: Last Piston licensed audio pack
on:
  push:
    branches: [engine-lab-audio13-assets]
    paths: [.github/workflows/last-piston-audio.yml]
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: engine-lab-audio13-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: last-piston-cc0-recordings
          run-id: 43751324460
          github-token: ${{ github.token }}
          path: audio-originals
      - name: Verify source hashes and create offline bank
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,base64,shutil
          source=pathlib.Path('audio-originals')
          target=pathlib.Path('engine-lab/assets/audio')
          target.mkdir(parents=True,exist_ok=True)
          manifest=json.loads((source/'manifest.json').read_text())
          bank={}
          for row in manifest:
              name=row['id']
              assert name in ['idle','load','starter','impact','rattle','click']
              assert row['license']=='CC0-1.0' and row['status']=='downloaded'
              raw=(source/(name+'.wav')).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==row['sha256']
              (target/(name+'.wav')).write_bytes(raw)
              bank[name]=base64.b64encode(raw).decode('ascii')
          assert len(bank)==6
          pathlib.Path('engine-lab/assets/soundbank.js').write_text('/* Verified CC0 source recordings. SHA-256 and attribution: audio-manifest.json. */\nwindow.Piston.EMBEDDED_AUDIO='+json.dumps(bank,separators=(',',':'))+';\n')
          PY
      - name: Commit only assets to the helper branch
        shell: bash
        run: |
          test "$(git branch --show-current)" = "engine-lab-audio13-assets"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine-lab/assets/audio/*.wav engine-lab/assets/soundbank.js
          git diff --cached --quiet && exit 0
          git commit -m 'assets: preserve six verified CC0 recordings and offline soundbank'
          git push origin HEAD:engine-lab-audio13-assets
