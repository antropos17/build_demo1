name: Last Piston licensed audio pack
on:
  push:
    branches: [engine-lab-audio13-assets]
    paths: [.github/workflows/last-piston-audio.yml]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download credited CC0 source recordings
        shell: bash
        run: |
          mkdir -p audio-pack
          python3 - <<'PY'
          import urllib.request, pathlib, hashlib, json, concurrent.futures, time
          root = pathlib.Path('audio-pack')
          sources = {
            'idle': ('https://opengameart.org/sites/default/files/loop_0.wav', 'domasx2', 'https://opengameart.org/content/racing-car-engine-sound-loops'),
            'load': ('https://raw.githubusercontent.com/esensar/bugged-racing/de0f97c7e0148968bbe65eda513c1dfc7060292e/assets/engine.wav', 'MarlonHJ', 'https://freesound.org/people/MarlonHJ/sounds/242740/'),
            'starter': ('https://opengameart.org/sites/default/files/generic_car_startengine.wav', 'looneybits', 'https://opengameart.org/content/car-engine-start-01'),
            'impact': ('https://opengameart.org/sites/default/files/clank1.wav', 'Brian MacIntosh (BMacZero)', 'https://opengameart.org/content/mechanical-sounds'),
            'rattle': ('https://opengameart.org/sites/default/files/rattle1.wav', 'Brian MacIntosh (BMacZero)', 'https://opengameart.org/content/mechanical-sounds'),
            'click': ('https://opengameart.org/sites/default/files/clink1_0.wav', 'Brian MacIntosh (BMacZero)', 'https://opengameart.org/content/metal-impact-sounds'),
          }
          def download(pair):
            name, (url, author, source) = pair
            record = dict(id=name, url=url, author=author, source=source, license='CC0-1.0')
            for attempt in range(3):
              try:
                req = urllib.request.Request(url, headers={'User-Agent':'Last-Piston-Asset-Pack/0.13'})
                with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read(8000001)
                if len(data) > 8000000 or data[:4] != b'RIFF' or data[8:12] != b'WAVE':
                  raise ValueError('not a bounded WAV file')
                (root / (name+'.wav')).write_bytes(data)
                record.update(bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),status='downloaded')
                print(name,len(data),flush=True)
                return record
              except Exception as error:
                record['error'] = str(error)
                time.sleep(attempt+1)
            record['status']='failed'
            return record
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
            results=list(pool.map(download,sources.items()))
          (root/'manifest.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - name: Upload source files and verified hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: last-piston-cc0-recordings
          path: audio-pack
          retention-days: 7
          if-no-files-found: error
